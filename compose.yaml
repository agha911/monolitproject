services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monolit_demo
      POSTGRES_USER: monolit
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - monolit_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monolit -d monolit_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  monolit_demo_data:
